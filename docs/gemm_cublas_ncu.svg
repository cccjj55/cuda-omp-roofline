<text x="735" y="200" fill="#8b949e" font-family="Consolas, monospace" font-size="10">Occ 16.6% · MIO stall 7.6%</text>
<text x="173" y="244" text-anchor="end" fill="#e6edf3" font-family="Consolas, monospace" font-size="11" font-weight="700">cuBLAS TF32 TC</text>
