<text x="205.0" y="112" fill="#f0f6fc" font-family="Consolas, monospace" font-size="11">1.33 TFLOP/s</text>
<text x="735" y="112" fill="#8b949e" font-family="Consolas, monospace" font-size="10">Occ 66.7% · MIO stall 2965%</text>
<text x="173" y="156" text-anchor="end" fill="#e6edf3" font-family="Consolas, monospace" font-size="11" font-weight="700">custom reg 4x4</text>
