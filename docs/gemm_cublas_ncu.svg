<text x="28" y="348" fill="#8b949e" font-family="Segoe UI, Arial, sans-serif" font-size="10">Measured via cublas_tensor_bench (CPU/cuBLAS rel_err &lt; 4.3e-4) and Nsight Compute 2025.1.0 (CC 12.0)</text>
