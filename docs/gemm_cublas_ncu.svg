<svg xmlns="http://www.w3.org/2000/svg" width="980" height="360" viewBox="0 0 980 360">
<rect width="100%" height="100%" rx="12" fill="#0d1117"/>
<text x="28" y="34" fill="#f0f6fc" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700">GEMM Scaling (n=2048): Naive Shared Mem vs Register Tiling vs cuBLAS Tensor Core (RTX 5070 Ti)</text>
<text x="28" y="54" fill="#8b949e" font-family="Segoe UI, Arial, sans-serif" font-size="12">Higher TFLOP/s comes with LOWER occupancy (8.3% vs 89.7%): large tiles + Tensor Cores clear MIO stalls (2966% -&gt; 6.7%)</text>
