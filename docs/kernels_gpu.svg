<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" viewBox="0 0 760 330" role="img" aria-label="GPU speedup over 12-thread OpenMP per kernel, including the softmax rewrite">
  <rect width="760" height="330" fill="#ffffff"/>
  <text x="24" y="28" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#0f172a">Same kernel, GPU vs 12-thread OpenMP — and what a rewrite bought</text>
  <text x="24" y="47" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#64748b">RTX 5070 Ti Laptop (sm_120) vs i7-14650HX 12 threads · 1.0 = equal · higher is better</text>

  <line x1="70" y1="250" x2="720" y2="250" stroke="#e2e8f0"/>
  <line x1="70" y1="250" x2="70" y2="80" stroke="#e2e8f0"/>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#94a3b8">
    <text x="62" y="254" text-anchor="end">0</text>
    <text x="62" y="204" text-anchor="end">2</text>
    <text x="62" y="154" text-anchor="end">4</text>
    <text x="62" y="104" text-anchor="end">6</text>
  </g>

  <!-- axpy 6.9 -->
  <rect x="110" y="77" width="86" height="173" fill="#0f766e"/>
  <text x="153" y="69" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#0f766e" text-anchor="middle">6.9×</text>
  <text x="153" y="270" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#475569" text-anchor="middle">axpy</text>
  <text x="153" y="286" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">58 → 403 GB/s</text>

  <!-- matmul double 6.3 -->
  <rect x="246" y="92" width="86" height="158" fill="#0f766e"/>
  <text x="289" y="84" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#0f766e" text-anchor="middle">6.3×</text>
  <text x="289" y="270" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#475569" text-anchor="middle">matmul (double)</text>
  <text x="289" y="286" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">70.6 → 445.6 GFLOP/s</text>

  <!-- softmax 1block 0.22 -->
  <rect x="382" y="231" width="86" height="19" fill="#b91c1c"/>
  <text x="425" y="223" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#b91c1c" text-anchor="middle">0.22×</text>
  <text x="425" y="270" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#475569" text-anchor="middle">softmax, 1 block</text>
  <text x="425" y="286" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">naive port</text>

  <!-- softmax grid 4.9 -->
  <rect x="518" y="128" width="86" height="122" fill="#0f766e"/>
  <text x="561" y="120" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#0f766e" text-anchor="middle">4.9×</text>
  <text x="561" y="270" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#475569" text-anchor="middle">softmax, grid</text>
  <text x="561" y="286" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">1.20 → 5.90 Gelem/s</text>

  <!-- arrow between the two softmax bars -->
  <g stroke="#0f766e" stroke-width="2" fill="none">
    <path d="M470 205 C 495 185, 500 165, 516 150" marker-end="url(#a)"/>
  </g>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
    <path d="M0,0 L6,3 L0,6 z" fill="#0f766e"/></marker></defs>
  <text x="470" y="196" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#0f766e">rewrite: 22.9×</text>

  <text x="640" y="150" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#94a3b8">grid-stride</text>
  <text x="640" y="164" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#94a3b8">+ 2-stage</text>
  <text x="640" y="178" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#94a3b8">reduction</text>
</svg>
